<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, addDoc,
    query, orderBy, limit, where, getDocs
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getStorage } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

  // Web App config from Firebase Console.
  const firebaseConfig = {
    apiKey: "AIzaSyCCWNxmoP0IF2Wu0nE3EKbCe1zc1G_jm1U",
    authDomain: "pelada-2bb96.firebaseapp.com",
    projectId: "pelada-2bb96",
    storageBucket: "pelada-2bb96.firebasestorage.app",
    messagingSenderId: "276578577472",
    appId: "1:276578577472:web:427bd948791013456fc3a5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const firestore = getFirestore(app);
  getStorage(app);

  // Small compatibility adapter for the existing HTML application.
  window.PELADA_FIREBASE = { app, auth, firestore };

  const wrapDoc = (path) => {
    const d = doc(firestore, ...path.split("/"));
    return {
      async set(data) { return setDoc(d, data, { merge: false }); },
      async delete() { return deleteDoc(d); },
      onSnapshot(cb, fail) {
        return onSnapshot(d, s => cb({
          exists: s.exists(),
          data: () => s.data() || {},
          id: s.id
        }), fail);
      }
    };
  };

  const wrapCollection = (name) => {
    const c = collection(firestore, name);
    return {
      onSnapshot(cb, fail) {
        return onSnapshot(c, s => cb({
          docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })),
          docChanges: () => s.docChanges().map(ch => ({
            type: ch.type,
            doc: { id: ch.doc.id, data: () => ch.doc.data() }
          }))
        }), fail);
      },
      add(data) { return addDoc(c, data); },
      orderBy(field, direction) {
        return {
          limit(n) {
            return {
              onSnapshot(cb, fail) {
                return onSnapshot(
                  query(c, orderBy(field, direction || "asc"), limit(n)),
                  s => cb({
                    docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })),
                    docChanges: () => s.docChanges().map(ch => ({
                      type: ch.type,
                      doc: { id: ch.doc.id, data: () => ch.doc.data() }
                    }))
                  }), fail
                );
              }
            };
          }
        };
      },
      where(field, op, value) {
        return {
          get() {
            return getDocs(query(c, where(field, op, value)));
          }
        };
      }
    };
  };

  window.PELADA_DB = {
    doc: wrapDoc,
    collection: wrapCollection
  };

  function userAdapter(firebaseUser) {
    return {
      async id() { return firebaseUser?.uid || null; },
      async canEdit() {
        // Admin status is controlled by Firestore rules/custom claims.
        // For the UI, set an "admins/{uid}" document.
        if (!firebaseUser) return false;
        try {
          const snap = await getDocs(query(
            collection(firestore, "admins"),
            where("uid", "==", firebaseUser.uid),
            limit(1)
          ));
          return !snap.empty;
        } catch (_) { return false; }
      }
    };
  }

  onAuthStateChanged(auth, async (firebaseUser) => {
    if (!firebaseUser) {
      try {
        await signInAnonymously(auth);
      } catch (e) {
        console.error("Firebase Auth:", e);
      }
      return;
    }
    window.PELADA_USER = userAdapter(firebaseUser);
    window.PELADA_FIREBASE_READY = true;
    if (typeof window.initPelada === "function") window.initPelada();
  });
</script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f3f5;--card:#fff;--tx:#1c232b;--mut:#6a7480;--pri:#2c3843;--pt:#fff;--yes:#4f7a68;--out:#a34f45;--unk:#8a929b;--bd:#dfe2e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161a;--card:#1b2127;--tx:#e6e9ec;--mut:#93a0ab;--pri:#cfd6dc;--pt:#12161a;--yes:#5f927d;--out:#c0776b;--unk:#5d6873;--bd:#2a323a}}
:root[data-theme="dark"]{--bg:#12161a;--card:#1b2127;--tx:#e6e9ec;--mut:#93a0ab;--pri:#cfd6dc;--pt:#12161a;--yes:#5f927d;--out:#c0776b;--unk:#5d6873;--bd:#2a323a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.match{background:linear-gradient(135deg,#34424f,#1f2932);color:#fff;border:0}
.match small{opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.match .big{font-size:26px;font-weight:700;text-transform:capitalize;margin:4px 0}
.match .row{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:0;border-radius:12px;padding:14px;font-weight:600;cursor:pointer;background:var(--bd);color:var(--tx)}
button:disabled{opacity:.45}
.in{background:var(--yes);color:#fff}.ou{background:var(--out);color:#fff}
.sel.in,.sel.ou{outline:3px solid var(--tx)}
.sm{padding:8px 12px;font-size:14px}
.pl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.pl:first-child{border-top:0}

.ph{display:flex;align-items:center;justify-content:center;background:var(--pri);color:var(--pt);font-weight:700;font-size:20px}
.pi{display:flex;flex-direction:column;min-width:0;flex:1}
.pi span{color:var(--mut);font-size:13px}.pi em{font-size:13px;color:var(--mut)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.tabs button{flex:1;padding:10px}.tabs .on{background:var(--pri);color:var(--pt)}
.mut{color:var(--mut);font-size:14px}.wait{color:#9a7b3c}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none}
.prev{width:96px;height:96px;margin-top:8px}
.pop{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;padding:0 12px;z-index:9;pointer-events:none}
.pop div{pointer-events:auto;background:var(--card);border:1px solid var(--pri);border-left:6px solid var(--pri);border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px #0004;animation:pin .3s;max-width:560px;width:100%;margin:0 auto}
@keyframes pin{from{transform:translateY(-20px);opacity:0}}
.tabs button{font-size:13px;padding:10px 2px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);white-space:nowrap}
.row2{display:flex;gap:8px;align-items:center}
.art{overflow:hidden;border-radius:20px;padding:22px 16px;margin-bottom:12px;text-align:center;color:#fff;background:repeating-linear-gradient(90deg,#34424f 0 40px,#303d49 40px 80px);box-shadow:inset 0 0 0 4px #ffffff55}
.art .lg{width:96px;height:96px;margin:0 auto 8px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:4px solid #fff}
.art .lg img{width:100%;height:100%;object-fit:cover}
.an{font-size:26px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.ad{margin-top:4px;text-transform:capitalize;font-size:15px}.ap{margin-top:6px;font-size:16px;font-weight:600}
.mp{display:inline-block;margin-top:12px;background:#fff;color:#2c3843;padding:10px 16px;border-radius:99px;text-decoration:none;font-weight:700;font-size:14px}
.tabs{align-items:flex-end}
.tabs .mid{flex:0 0 100px;margin-top:-28px;padding:12px 6px;border-radius:26px;background:var(--pri);color:var(--pt);font-size:14px;font-weight:800;box-shadow:0 4px 14px #0006;border:3px solid var(--card)}
.tabs .mid.on{outline:3px solid var(--tx)}
.tabs .pulse{animation:pls 1.6s infinite}
@keyframes pls{50%{transform:scale(1.07)}}
.tabs .mid{transition:background .25s}
.tabs .mid.yes{background:var(--yes);color:#fff}
.tabs .mid.no{background:var(--out);color:#fff}
.tabs .mid.unk{background:var(--unk);color:#fff}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto;padding:10px 14px 4px;background:var(--bg)}
#hd select{flex:1;font-weight:700}

<body>
<header id="hd"></header>
<main id="app"><p class="mut">Carregando…</p></main>
<div id="toast"></div>
<div id="pop" class="pop"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script>
const POS_MAP={society:['Goleiro','Zagueiro','Lateral','Meio-campo','Ala','Atacante','Qualquer posição'],
futsal:['Goleiro','Fixo','Ala direita','Ala esquerda','Pivô','Qualquer posição'],
campo:['Goleiro','Zagueiro','Lateral direito','Lateral esquerdo','Volante','Meio-campo','Ponta direita','Ponta esquerda','Atacante','Qualquer posição']};
const posList=()=>POS_MAP[(space&&space.field)||'society']||POS_MAP.society;
const FOOT=['Destro','Canhoto','Ambidestro'],LVL=['Resenha','Mediano','Fominha'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,user=null,uid=null,isAdmin=false,match=null,players=[],view='home',ready=0,photo='',armed=null,fin={},fcfg={mensal:43,diaria:0},teams=[],assign={},brand={},roles={},spaces=[],sid=null,space={},allP=[],rawFin={},prof=null,unsub=null,bbq=null,editArt=false,reminderOff=false,ensuringTeams=false;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
const fail=e=>toast(e&&e.code==='invalid_argument'?'Sem permissão para essa ação.':'Algo deu errado. Tente de novo.');
const eff=p=>match&&p.for===match.key?p.status:null;
const opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
const av=p=>p.photo&&/^data:image\//.test(p.photo)?`<img class="av" src="${esc(p.photo)}" alt="">`:`<div class="av ph">${esc((p.name||'?')[0].toUpperCase())}</div>`;
const card=(p,x='')=>`<div class="pl">${av(p)}<div class="pi"><b>${esc(p.name)} ${roleTag(p)}</b><span>${esc([p.pos,p.foot,p.level].filter(Boolean).join(' · '))}</span>${p.bio?`<em>${esc(p.bio)}</em>`:''}</div>${x}</div>`;

async function init(){
  try{
    db=window.PELADA_DB;
    user=window.PELADA_USER;
  }catch(e){}
  if(!db){ready=1;render();return}
  if(user){try{uid=await user.id();isAdmin=await user.canEdit()}catch(e){}}
  db.doc('config/spaces').onSnapshot(s=>{spaces=s.exists?(s.data().list||[]):[];ready|=4;pick();rr()},fail);
  db.collection('players').onSnapshot(s=>{allP=s.docs.map(d=>({id:d.id,...d.data()}));ready|=2;derive();if(!feed.on){feed.on=1;feed()}rr()},fail);
  if(isAdmin)db.collection('finance').onSnapshot(s=>{rawFin={};s.docs.forEach(d=>rawFin[d.id]=d.data());derive();rr()},fail);
  else if(uid)db.doc('finance/'+uid).onSnapshot(s=>{rawFin={[uid]:s.exists?s.data():{}};derive();rr()},fail);
  render();
}
window.initPelada=init;
function matchWin(){if(!match)return null;const d=new Date(match.date+'T'+(match.time||'00:00'));if(isNaN(d))return null;return{open:Date.now()>=d.getTime()-3*864e5,start:new Date(d.getTime()-3*864e5),d}}
function rr(){const a=document.activeElement;if(view==='form'||(view==='admin'&&isAdmin)||(a&&/INPUT|TEXTAREA/.test(a.tagName)))return;render()}

function render(){
  const app=$('#app'),tabs=$('#tabs');
  if(!db){tabs.hidden=true;app.innerHTML='<h1>Pelada</h1><div class="card">Não foi possível conectar. Abra o link estando logado no Claude e com acesso à página (peça ao organizador para te convidar como <b>Contribuidor</b>).</div>';return}
  tabs.hidden=false;
  $('#hd').innerHTML=`<select data-c="sp">${spaces.length?spaces.map(x=>`<option value="${esc(x.id)}"${x.id===sid?' selected':''}>${esc(x.name)}</option>`).join(''):'<option>Sem espaços</option>'}</select><button class="sm" data-a="go" data-v="form" title="Meu perfil">Perfil</button>${isAdmin?'<button class="sm" data-a="go" data-v="spaces">Espaços</button>':''}`;
  const me=players.find(p=>p.id===uid),st=me&&eff(me),lab=st==='in'?'Estou dentro':st==='out'?'Estou fora':'Confirmar',ic=st==='in'?'✓':st==='out'?'✕':'?';
  const T=isAdmin?[['admin','','Partida'],['teams','','Times'],['home',ic,lab],['bbq','','Churrasco'],['fin','','Caixa']]:[['admin','','Partida'],['home',ic,lab],['bbq','','Churrasco']];
  tabs.innerHTML=T.map(([v,i,t])=>`<button class="${(view===v?'on ':'')+(v==='home'?'mid '+(st==='in'?'yes':st==='out'?'no':'unk')+(me&&match&&!st?' pulse':''):'')}" data-a="go" data-v="${v}">${v==='home'?`<b style="font-size:28px;line-height:1">${i}</b><br>`:''}${t}</button>`).join('');
  if(isAdmin&&view==='teams'&&sid&&!teams.length&&!ensuringTeams){ensuringTeams=true;cfgSet({teams:[{id:'tv',name:'Time Verde',slots:7,color:'#3f6b52'},{id:'tp',name:'Time Preto',slots:7,color:'#2b2f33'}]}).finally(()=>ensuringTeams=false)}
  app.innerHTML=(!sid&&view!=='form'&&view!=='spaces')?homeV():view==='form'?formV():view==='admin'?matchV():isAdmin&&view==='teams'?teamsV():isAdmin&&view==='fin'?finV():isAdmin&&view==='spaces'?spacesV():view==='bbq'?bbqV():homeV();
}

function homeV(){
  if(ready<7)return '<p class="mut">Carregando…</p>';
  if(!sid)return '<h1>Pelada</h1><div class="card">'+(isAdmin?'Crie o primeiro espaço (ex.: Segundas) em Espaços, no topo.':'Aguarde o organizador criar um espaço.')+'</div>';
  const me=players.find(p=>p.id===uid),st=me?eff(me):null,lim=+(match&&match.limit)||0,win=matchWin();
  const ins=players.filter(p=>eff(p)==='in').sort((a,b)=>(a.at||0)-(b.at||0));
  const outs=players.filter(p=>eff(p)==='out'),pend=players.filter(p=>!eff(p));
  let h='<h1>Pelada</h1>';
  if(match){
    const d=new Date(match.date+'T'+(match.time||'00:00')),ok=!isNaN(d);
    h+=`<div class="card match"><small>Próxima partida</small><div class="big">${ok?esc(d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})):esc(match.date)}</div><div class="row"><span>${esc(match.time||'—')}</span>${match.place?`<span>${esc(match.place)}</span>`:''}<span>${ins.length}${lim?'/'+lim:''} confirmados</span></div></div>`;
  }else h+='<div class="card"><b>Nenhuma partida marcada ainda.</b><div class="mut">'+(isAdmin?'Crie a próxima na aba Admin.':'Aguarde o organizador.')+'</div></div>';
  if(me&&win&&win.open&&!st&&!reminderOff)h+=`<div class="card" style="border-left:6px solid var(--yes)"><div class="row2"><b style="flex:1">Lembrete de partida</b><button class="sm" data-a="dismiss">Fechar</button></div><div class="mut" style="margin:4px 0 10px">Partida em ${esc(win.d.toLocaleDateString('pt-BR',{day:'numeric',month:'long'}))}${match.time?' às '+esc(match.time):''}. Confirme sua presença para ajudar na organização.</div><div class="btns"><button class="in" data-a="st" data-s="in">Estou dentro</button><button class="ou" data-a="st" data-s="out">Estou fora</button></div></div>`;
  if(!uid)h+='<div class="card mut">Entre com sua conta do Claude para se cadastrar e confirmar presença.</div>';
  else if(prof&&!me)h+=`<div class="card"><b>Entrar em ${esc(spName())}</b><div class="mut" style="margin:4px 0 12px">Participe desta lista para confirmar presença.</div><button class="in" data-a="join" style="width:100%">Entrar neste espaço</button></div>`;
  else if(!me)h+='<div class="card"><b>Primeiro, crie seu cadastro</b><div class="mut" style="margin:4px 0 12px">Foto, posição e suas características.</div><button class="in" data-a="go" data-v="form" style="width:100%">Criar meu cadastro</button></div>';
  else{const on=match&&(!win||win.open);h+=`<div class="card"><b>Você vai jogar?</b>${win&&!win.open?`<div class="mut" style="margin-top:6px">Confirmação abre em ${esc(win.start.toLocaleDateString('pt-BR'))} (3 dias antes da partida).</div>`:''}<div class="btns" style="margin-top:10px"><button class="in ${st==='in'?'sel':''}" data-a="st" data-s="in" ${on?'':'disabled'}>Estou dentro</button><button class="ou ${st==='out'?'sel':''}" data-a="st" data-s="out" ${on?'':'disabled'}>Estou fora</button></div></div>`}
  if(me)h+=payCard(me,fin[uid]||{});
  if(me&&(fin[uid]||{}).type==='mensalista'&&new Date().getDate()<=5)h+=`<div class="card" style="border-left:6px solid var(--yes)"><b>Pagamento mensal</b><div class="mut" style="margin:4px 0 8px">Período de pagamento: dia 1 a 5. R$ ${fcfg.mensal} via Pix.</div><button class="sm" data-a="pix" data-t="m">Copiar PIX</button></div>`;
  h+=`<h2>Confirmados (${ins.length})</h2><div class="card">${ins.length?ins.map((p,i)=>card(p,lim&&i>=lim?'<span class="wait">espera</span>':'')).join(''):'<span class="mut">Ninguém confirmou ainda.</span>'}</div>`;
  if(teams.length)h+='<h2>Times</h2>'+teams.map(t=>{const m=members(t);return `<div class="card" style="border-left:6px solid ${esc(t.color)}"><b>${esc(t.name)}</b> <span class="tag">${m.length}/${t.slots} vagas</span>${m.map(p=>card(p)).join('')}</div>`}).join('');
  if(outs.length)h+=`<h2>Fora (${outs.length})</h2><div class="card">${outs.map(p=>card(p)).join('')}</div>`;
  if(pend.length)h+=`<h2>Sem resposta (${pend.length})</h2><div class="card">${pend.map(p=>card(p)).join('')}</div>`;
  return h;
}

function formV(){
  if(!uid)return '<h1>Meu perfil</h1><div class="card mut">Entre com sua conta do Claude para criar o cadastro.</div>';
  const me=prof||{};photo=me.photo||'';
  return `<h1>Meu perfil</h1><div class="card"><label>Foto</label><input type="file" accept="image/*" id="ph">${photo?av(me).replace('class="av"','class="av prev"'):'<img class="av prev" id="pv" hidden alt="">'}
<label>Nome / apelido</label><input id="nm" maxlength="40" value="${esc(me.name)}">
<label>Posição</label><select id="ps">${opts(posList(),me.pos)}</select>
<label>Perna boa</label><select id="ft">${opts(FOOT,me.foot)}</select>
<label>Estilo de jogo</label><select id="lv">${opts(LVL,me.level)}</select>
<label>Características</label><textarea id="bio" rows="3" maxlength="200" placeholder="Ex.: rápido, bom de passe, não corre pra trás…">${esc(me.bio)}</textarea>
<div class="card mut" style="margin:16px 0 0">Pagamento: mensalidade R$ ${fcfg.mensal} · goleiro não paga. A chave Pix aparece após o organizador definir se você é mensalista ou diarista.</div>
<button class="in" data-a="save" style="width:100%;margin-top:16px">Salvar cadastro</button></div>`;
}

function adminV(){
  const m=match||{};
  return `<h1>Partida</h1><div class="card"><b>Próxima partida</b>
<label>Data</label><input type="date" id="md" value="${esc(m.date)}"><label>Hora</label><input type="time" id="mt" value="${esc(m.time)}">
<label>Local</label><input id="mp" maxlength="80" value="${esc(m.place)}"><label>Vagas (0 = sem limite)</label><input type="number" id="ml" min="0" value="${esc(m.limit??0)}">
<div class="btns" style="margin-top:14px"><button class="in" data-a="match" data-n="0" ${match?'':'disabled'}>Salvar edição</button><button data-a="match" data-n="1">Nova partida</button></div>
<div class="mut" style="margin-top:8px">“Nova partida” zera as confirmações; “Salvar edição” mantém.</div></div>
<h2>Jogadores (${players.length})</h2><div class="card">${players.map(p=>card(p,`<button class="sm ou" data-a="del" data-id="${esc(p.id)}">${armed===p.id?'Confirmar?':'Remover'}</button>`)).join('')||'<span class="mut">Ninguém cadastrado.</span>'}</div>
<div class="card mut">Para convidar jogadores, use “Compartilhar” nesta página e dê acesso de <b>Contribuidor</b>.</div>`;
